[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-search"
version = "1.0.0"
authors = [
    { name = "Draeician", email = "draeician@gmail.com" },
]
description = "A Python package for time-based search functionality"
readme = "README.md"
requires-python = ">=3.7"
dependencies = [
    "python-magic",
    "python-dotenv",
    "pytest",
    "pytest-asyncio",
    "aiohttp",
    "asyncio",
    "typing-extensions",
    "pydantic"
]

[project.scripts]
time-search = "time_search.main:main"
# Singular forms
minute = "time_search.main:main"
hour = "time_search.main:main"
day = "time_search.main:main"
week = "time_search.main:main"
month = "time_search.main:main"
year = "time_search.main:main"
# Plural forms
minutes = "time_search.main:main"
hours = "time_search.main:main"
days = "time_search.main:main"
weeks = "time_search.main:main"
months = "time_search.main:main"
years = "time_search.main:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["time_search"] 